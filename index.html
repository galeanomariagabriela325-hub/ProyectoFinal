<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/x-icon" href="./blackhole.png">
    <title>BANARAS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Link to render the home icon -->
    <link rel="estilo" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Official PageFlip Library restored for realistic physics -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>


</head>
<body class="min-h-screen flex flex-col justify-center items-center py-6 px-4 md:py-10 relative">

    <!-- Home Navigation link fixed overlay -->
    <a href="https://de-poiesis.vercel.app" class="nav-home" aria-label="Home">
        <i class="fas fa-home"></i>
    </a>

    <!-- Premium Multi-layered Ambient Glows behind the book container -->
    <div class="ambient-light fixed top-[30%] left-[30%] -translate-x-1/2 -translate-y-1/2 w-[70vw] h-[70vh] bg-blue-600/10 rounded-full blur-[130px] pointer-events-none -z-10"></div>
    <div class="ambient-light fixed top-[70%] left-[70%] -translate-x-1/2 -translate-y-1/2 w-[60vw] h-[60vh] bg-indigo-900/15 rounded-full blur-[130px] pointer-events-none -z-10 animate-[ambientPulse_12s_ease-in-out_infinite_2s]"></div>
    
    <header class="mb-6 md:mb-10 text-center z-50 relative pointer-events-none flex-shrink-0">
        <h1 class="font-playfair text-3xl md:text-5xl font-bold tracking-widest text-white/95 drop-shadow-lg">BANARAS</h1>
        <p class="font-inter text-white/60 text-xs md:text-sm mt-2 uppercase tracking-[0.25em]">A Digital Magazine </p>
         <p class="font-inter text-white/60 text-xs md:text-sm mt-2 uppercase tracking-[0.25em]">by Navneet</p>
    </header>

    <main class="w-full max-w-6xl flex flex-col items-center flex-grow justify-center relative">
        
        <div id="pan-overlay" class="fixed inset-0 z-40 hidden cursor-grab" style="touch-action: none; max-width:100vw;"></div>

        <div id="transform-wrapper" class="z-10 relative w-full flex justify-center items-center">
            <div class="flip-book-wrapper drop-shadow-[0_20px_40px_rgba(0,0,0,0.6)]">
                <div id="book" class="w-full h-full">
                    
                    <!-- Left cover placeholder: Opaque solid match -->
                    <div class="page spine-left">
                        <div class="page-content dummy-cover"></div>
                    </div>

                    <div class="page spine-right"><div class="page-content relative img-placeholder"><img src="Magazine/file%20image-01.png" alt="Page 1" /></div></div>
                    <div class="page spine-left"><div class="page-content relative img-placeholder"><img src="Magazine/file%20image-02.png" alt="Page 2" /></div></div>
                    <div class="page spine-right"><div class="page-content relative img-placeholder"><img src="Magazine/file%20image-03.png" alt="Page 3" /></div></div>
                    <div class="page spine-left"><div class="page-content relative img-placeholder"><img src="Magazine/file%20image-04.png" alt="Page 4" /></div></div>
                    <div class="page spine-right"><div class="page-content relative img-placeholder"><img src="Magazine/file%20image-05.png" alt="Page 5" /></div></div>
                    <div class="page spine-left"><div class="page-content relative img-placeholder"><img src="Magazine/file%20image-06.png" alt="Page 6" /></div></div>

                    <div class="page spine-right"><div class="page-content relative img-placeholder"><img src="Magazine/file%20image-07.png" alt="Page 7" /></div></div>
                    <div class="page spine-left"><div class="page-content relative img-placeholder"><img src="Magazine/file%20image-08.png" alt="Page 8" /></div></div>
                    <div class="page spine-right"><div class="page-content relative img-placeholder"><img src="Magazine/file%20image-09.png" alt="Page 9" /></div></div>
                    <div class="page spine-left"><div class="page-content relative img-placeholder"><img src="Magazine/file%20image-10.png" alt="Page 10" /></div></div>
                    <div class="page spine-right"><div class="page-content relative img-placeholder"><img src="Magazine/file%20image-11.png" alt="Page 11" /></div></div>
                    <div class="page spine-left"><div class="page-content relative img-placeholder"><img src="Magazine/file%20image-12.png" alt="Page 12" /></div></div>

                    <div class="page spine-right"><div class="page-content relative img-placeholder"><img src="Magazine/file%20image-13.png" alt="Page 13" /></div></div>
                    <div class="page spine-left"><div class="page-content relative img-placeholder"><img src="Magazine/file%20image-14.png" alt="Page 14" /></div></div>
                    <div class="page spine-right"><div class="page-content relative img-placeholder"><img src="Magazine/file%20image-15.png" alt="Page 15" /></div></div>
                    <div class="page spine-left"><div class="page-content relative img-placeholder"><img src="Magazine/file%20image-16.png" alt="Page 16" /></div></div>
                    <div class="page spine-right"><div class="page-content relative img-placeholder"><img src="Magazine/file%20image-17.png" alt="Page 17" /></div></div>
                    <div class="page spine-left"><div class="page-content relative img-placeholder"><img src="Magazine/file%20image-18.png" alt="Page 18" /></div></div>
                    
                    <!-- Right back-cover placeholder: Opaque solid match -->
                    <div class="page spine-right">
                         <div class="page-content dummy-cover"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-6 md:mt-10 flex flex-col items-center gap-3 z-50 relative flex-shrink-0">
            <div class="flex items-center gap-4 md:gap-6 bg-white/10 backdrop-blur-xl px-6 py-2.5 rounded-full border border-white/20 shadow-[0_8px_32px_rgba(0,0,0,0.3)]">
                <button id="btn-prev" class="text-white/70 hover:text-white transition-all p-2 rounded-full hover:bg-white/20 active:scale-90" title="Previous Page">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <div class="text-white/90 font-inter text-sm md:text-base font-semibold flex items-center gap-2">
                    <span id="page-current" class="w-12 text-center">1</span> / <span id="page-total" class="text-white/60">18</span>
                </div>
                <button id="btn-next" class="text-white/70 hover:text-white transition-all p-2 rounded-full hover:bg-white/20 active:scale-90" title="Next Page">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </button>

                <div class="w-px h-6 bg-white/20 mx-1 md:mx-2"></div>

                <button id="btn-zoom-out" class="text-white/70 hover:text-white transition-all p-2 rounded-full hover:bg-white/20 active:scale-90" title="Zoom Out">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7"></path></svg>
                </button>
                <button id="btn-zoom-reset" class="text-white/70 hover:text-white transition-all p-2 rounded-full hover:bg-white/20 active:scale-90 hidden" title="Reset Zoom">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                </button>
                <button id="btn-zoom-in" class="text-white/70 hover:text-white transition-all p-2 rounded-full hover:bg-white/20 active:scale-90" title="Zoom In">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg>
                </button>
            </div>
            <p id="instruction-text" class="text-white/50 text-[10px] md:text-xs font-inter uppercase tracking-[0.2em] transition-colors duration-300">Drag corners to flip or use arrows</p>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // 1. Initialize Flipbook with responsive boundaries and locked parent dimensions
            const bookContainer = document.getElementById('book');
            const pageFlip = new St.PageFlip(bookContainer, {
                width: 452,
                height: 636,

                size: "stretch",

                minWidth: 280,
                maxWidth: 900,

                minHeight: 400,
                maxHeight: 1200,

                maxShadowOpacity: 0.15, // Immersion shadows

                showCover: false, // Soft covers setup
                mobileScrollSupport: false,
                usePortrait: true,
                autoSize: false // Disables runtime DOM resizing of parent node to prevent shifting
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            // 2. Real Page Flip Audio
            let pageSound = null;

            function initAudio() {
                if (pageSound) return;

                pageSound = new Audio("Magazine/page-flip-4.mp3");
                pageSound.preload = "auto";
                pageSound.load();

                pageSound.volume = 0.5;

                // Unlock audio on first interaction
                pageSound.play()
                    .then(() => {
                        pageSound.pause();
                        pageSound.currentTime = 0;
                    })
                    .catch(() => {});
            }

            document.addEventListener("click", initAudio, { once: true });
            document.addEventListener("touchstart", initAudio, { once: true });

            function playTurnSound() {
                if (!pageSound) return;

                // Create a fresh instance for instant playback
                const s = pageSound.cloneNode();
                s.volume = 0.5;
                s.play().catch(()=>{});
            }

            // 3. UI Interactions & Event Listeners
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const pageCurrentDisplay = document.getElementById('page-current');
            
            // Calculate total excluding cover and back cover if they are blanks
            const pagesList = document.querySelectorAll('.page');
            const totalPages = pagesList.length;
            document.getElementById('page-total').textContent = totalPages - 2;

            btnPrev.addEventListener('click', () => { if(currentScale === 1) pageFlip.flipPrev(); });
            btnNext.addEventListener('click', () => { if(currentScale === 1) pageFlip.flipNext(); });

            pageFlip.on('flip', (e) => {
                const targetPageIndex = e.data;
                const orientation = pageFlip.getOrientation();
                
                // Portrait redirection handling to skip empty dummy pages on mobile
                if (orientation === 'portrait') {
                    if (targetPageIndex === 0) {
                        pageFlip.turnToPage(1);
                        return;
                    }
                    if (targetPageIndex === totalPages - 1) {
                        pageFlip.turnToPage(totalPages - 2);
                        return;
                    }
                    pageCurrentDisplay.textContent = targetPageIndex;
                } else {
                    // Landscape display
                    if (targetPageIndex === 0 || targetPageIndex === 1) {
                        pageCurrentDisplay.textContent = "1";
                    } else if (targetPageIndex === totalPages - 1 || targetPageIndex === totalPages - 2) {
                        pageCurrentDisplay.textContent = totalPages - 2;
                    } else {
                        const leftPage = Math.floor(targetPageIndex / 2) * 2;
                        const rightPage = leftPage + 1;
                        pageCurrentDisplay.textContent = `${leftPage}-${rightPage}`;
                    }
                }
                
                playTurnSound();
            });

            document.addEventListener('keydown', (e) => {
                if (currentScale > 1) return; 
                if (e.key === 'ArrowLeft') pageFlip.flipPrev();
                else if (e.key === 'ArrowRight') pageFlip.flipNext();
            });

            // ==========================================
            // 4. ZOOM & PAN IMPLEMENTATION (HARDWARE ACCELERATED)
            // ==========================================
            
            const transformWrapper = document.getElementById('transform-wrapper');
            const panOverlay = document.getElementById('pan-overlay');
            const instructionText = document.getElementById('instruction-text');
            
            const btnZoomIn = document.getElementById('btn-zoom-in');
            const btnZoomOut = document.getElementById('btn-zoom-out');
            const btnZoomReset = document.getElementById('btn-zoom-reset');

            let currentScale = 1;
            const maxScale = 5;
            const minScale = 1;
            const scaleStep = 0.5;

            let isDragging = false;
            let startX = 0, startY = 0;
            let panX = 0, panY = 0;

            function updateZoom() {
                if (currentScale <= 1) {
                    currentScale = 1;
                    panX = 0;
                    panY = 0;
                }

                // translate3d engages the GPU for much smoother performance on mobile and desktop
                transformWrapper.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${currentScale})`;

                if (currentScale > 1) {
                    if (panOverlay) {
                        panOverlay.classList.remove('hidden');
                    }
                    if (btnZoomReset) btnZoomReset.classList.remove('hidden');
                    
                    if (btnPrev) btnPrev.classList.add('opacity-30', 'cursor-not-allowed', 'pointer-events-none');
                    if (btnNext) btnNext.classList.add('opacity-30', 'cursor-not-allowed', 'pointer-events-none');
                    
                    if (instructionText) {
                        instructionText.textContent = "Zoom Mode Active • Drag to Pan";
                        instructionText.classList.replace('text-white/50', 'text-amber-400');
                    }
                } else {
                    if (panOverlay) panOverlay.style.cursor = 'grab';
                    if (panOverlay) panOverlay.classList.add('hidden');
                    if (btnZoomReset) btnZoomReset.classList.add('hidden');
                    
                    if (btnPrev) btnPrev.classList.remove('opacity-30', 'cursor-not-allowed', 'pointer-events-none');
                    if (btnNext) btnNext.classList.remove('opacity-30', 'cursor-not-allowed', 'pointer-events-none');
                    
                    if (instructionText) {
                        instructionText.textContent = "Drag corners to flip or use arrows";
                        instructionText.classList.replace('text-amber-400', 'text-white/50');
                    }
                }
            }

            if (btnZoomIn) {
                btnZoomIn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (currentScale < maxScale) { currentScale += scaleStep; updateZoom(); }
                });
            }

            if (btnZoomOut) {
                btnZoomOut.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (currentScale > minScale) { currentScale -= scaleStep; updateZoom(); }
                });
            }

            if (btnZoomReset) {
                btnZoomReset.addEventListener('click', (e) => {
                    e.stopPropagation();
                    currentScale = 1; updateZoom();
                });
            }

            // Panning Logic with hardware acceleration
            function startPan(clientX, clientY) {
                if (currentScale <= 1) return; 
                isDragging = true;
                startX = clientX - panX;
                startY = clientY - panY;
                if (panOverlay) panOverlay.style.cursor = 'grabbing';
                transformWrapper.classList.add('is-dragging'); 
            }

            function doPan(clientX, clientY, e) {
                if (!isDragging) return;
                if (e) e.preventDefault(); 
                
                let targetX = clientX - startX;
                let targetY = clientY - startY;

                // Better boundary calculation based on current viewport to prevent dragging the book off screen
                const boundaryX = (window.innerWidth * currentScale) / 2.5;
                const boundaryY = (window.innerHeight * currentScale) / 2.5;

                panX = Math.max(-boundaryX, Math.min(boundaryX, targetX));
                panY = Math.max(-boundaryY, Math.min(boundaryY, targetY));

                transformWrapper.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${currentScale})`;
            }

            function endPan() {
                if (isDragging) {
                    isDragging = false;
                    if (panOverlay) panOverlay.style.cursor = 'grab';
                    transformWrapper.classList.remove('is-dragging'); 
                }
            }

            // Mouse Events
            if (panOverlay) panOverlay.addEventListener('mousedown', (e) => startPan(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => doPan(e.clientX, e.clientY, e));
            window.addEventListener('mouseup', endPan);

            // Touch Events
            if (panOverlay) {
                panOverlay.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) startPan(e.touches[0].clientX, e.touches[0].clientY);
                }, { passive: false });
            }
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1 && isDragging) doPan(e.touches[0].clientX, e.touches[0].clientY, e);
            }, { passive: false });
            window.addEventListener('touchend', endPan);
        });
    </script>
</body>
</html>
